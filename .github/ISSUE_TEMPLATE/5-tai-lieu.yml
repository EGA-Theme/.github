name: Tài liệu hướng dẫn
description: Viết mới hoặc sửa tài liệu hướng dẫn chủ shop dùng theme.
title: "[Tài liệu] <trang cần viết hoặc sửa>"
labels: ["documentation"]
projects: ["EGA-Theme/1"]
body:
  - type: dropdown
    id: nen-tang
    attributes:
      label: Nền tảng
      options:
        - Sapo
        - Haravan
        - Cả hai
    validations:
      required: true
  - type: input
    id: trang
    attributes:
      label: Trang tài liệu
      description: Tên trang trong tài liệu GitBook hoặc đường dẫn file. Trang mới thì ghi nhóm sẽ đặt vào.
    validations:
      required: true
  - type: textarea
    id: ly-do
    attributes:
      label: Vì sao cần viết hoặc sửa
      description: Thiết lập mới, giao diện đổi, hoặc chủ shop hỏi lại nhiều lần.
    validations:
      required: true
  - type: textarea
    id: noi-dung
    attributes:
      label: Nội dung cần có
      description: Các bước, ô thiết lập, ảnh chụp cần chụp lại.
